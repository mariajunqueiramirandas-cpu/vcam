name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install WDK (NuGet, only if the runner doesn't already have one)
        shell: pwsh
        run: |
          $wdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\wdm.h" -ErrorAction SilentlyContinue
          if ($wdk) {
            "WDK already installed: $($wdk.FullName)"
          } else {
            "No WDK on this runner; restoring from NuGet (see Directory.Build.props)."
            nuget restore packages.config -PackagesDirectory packages
          }

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build
        run: msbuild vcam.sln -m -p:Configuration=Release -p:Platform=x64 -v:m -bl:build.binlog

      - name: Collect the installable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item driver\x64\Release\vcam\vcam.sys, driver\x64\Release\vcam\vcam.inf, driver\x64\Release\vcam\vcam.cat `
                    bin\x64\Release\vcamctl.exe, scripts\install.ps1, scripts\uninstall.ps1 -Destination dist\
          Get-ChildItem dist | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: vcam-x64
          path: dist/**

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.binlog
