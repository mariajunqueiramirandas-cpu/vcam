name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Show installed toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -all -products * -format json | ConvertFrom-Json |
            ForEach-Object { "{0} {1} -> {2}" -f $_.displayName, $_.installationVersion, $_.installationPath }
          "--- Windows Kits Include:"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          "--- WDK kernel headers:"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\wdm.h" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          "--- Kernel-mode driver toolset:"
          Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\*\*\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: Restore WDK from NuGet (only if not installed)
        shell: pwsh
        run: |
          if (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\wdm.h" -ErrorAction SilentlyContinue) {
            "WDK is installed; skipping NuGet restore."
          } else {
            nuget restore packages.config -PackagesDirectory packages
          }

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild vcam.sln -m -p:Configuration=Release -p:Platform=x64 -v:m -bl:build.binlog

      - name: List outputs
        if: always()
        shell: pwsh
        run: Get-ChildItem driver\x64, bin -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            driver/x64/**
            bin/**
            build.binlog
